[project]
name = "sk_app"
authors = [{ name = "SK Ind Tech Solutions Pvt Ltd", email = "skind.tech.ai@gmail.com" }]
description = "SK App: mobile work app (PWA) for SK Ind Tech, inside ERPNext, with Claude guidance"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "anthropic>=1.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
